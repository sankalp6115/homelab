# contains gotify for notification and uptime-kuma for monitoring
name: homelab

services:
  gotify:
    image: gotify/server
    restart: unless-stopped
    ports:
      - 8000:80
    volumes:
      - ${CONTAINER_DATA_ROOT:-./data}/gotify:/app/data

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    ports:
      - 8001:3001
    volumes:
      - ${CONTAINER_DATA_ROOT:-./data}/uptime-kuma:/app/data