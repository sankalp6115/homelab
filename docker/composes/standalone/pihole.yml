# =============================================================================
# Pi-hole — network-wide DNS ad blocker (v6)
# Standalone compose file.
#
# Usage (from docker/ root):
#   docker compose -f composes/standalone/pihole.yml --env-file .env up -d
#
# IMPORTANT: Port 53 must be free on the host. On modern Linux/macOS, systemd-
# resolved or mDNSResponder may occupy it. See Pi-hole docs for pre-requisites.
# =============================================================================

name: pihole

services:
  pihole:
    # Docker Hub: https://hub.docker.com/r/pihole/pihole
    # Pinning to 'latest' is acceptable for homelab; replace with a version tag
    # (e.g. 2024.07.0) for stability.
    image: pihole/pihole:latest
    restart: unless-stopped

    ports:
      # DNS — TCP & UDP (must be reachable on the LAN)
      - "53:53/tcp"
      - "53:53/udp"
      # Web UI  (mapped to ${PIHOLE_WEB_PORT} to avoid conflict with port 80)
      - "${PIHOLE_WEB_PORT:-8080}:80"
      # HTTPS (self-signed cert generated by FTL)
      - "443:443/tcp"
      # Uncomment if using Pi-hole as DHCP server
      # - "67:67/udp"
      # Uncomment if using Pi-hole as NTP server
      # - "123:123/udp"

    environment:
      TZ: ${TZ}
      # Upstream DNS resolvers used by Pi-hole
      FTLCONF_dns_upstreams: "${PIHOLE_DNS1:-1.1.1.1};${PIHOLE_DNS2:-8.8.8.8}"
      # Web interface / FTL API password — CHANGE THIS
      FTLCONF_webserver_api_password: "${PIHOLE_WEB_PASSWORD:-changeme}"
      # Required when using Docker's default bridge network
      FTLCONF_dns_listeningMode: "ALL"

    volumes:
      # Persists Pi-hole's databases and main config
      - "${DATA_ROOT}/pihole/etc-pihole:/etc/pihole"
      # Uncomment if you have custom dnsmasq configs (see Pi-hole v6 migration notes)
      # - "${DATA_ROOT}/pihole/etc-dnsmasq.d:/etc/dnsmasq.d"

    cap_add:
      # Required for DHCP server functionality; can be removed if not using DHCP
      - NET_ADMIN
      # Required if Pi-hole manages the host's system time (NTP)
      - SYS_TIME
      # Optional: gives Pi-hole slightly higher scheduling priority
      - SYS_NICE

    networks:
      - homelab

    labels:
      # Stub for future reverse-proxy (Traefik / nginx-proxy) labels.
      # traefik.enable: "false"
      homelab.service: "pihole"
      homelab.group: "standalone"

networks:
  homelab:
    external: true

