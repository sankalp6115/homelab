name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout deploy branch
        uses: actions/checkout@v4
        with:
          ref: deploy
          path: deploy_repo
          fetch-depth: 0

      - name: Build React frontends dynamically
        run: |
          # Discover any app containing a frontend with a package.json
          for pkg in source/apps/*/frontend/package.json; do
            [ -f "$pkg" ] || continue
            frontend_dir="$(dirname "$pkg")"
            app_name="$(basename "$(dirname "$frontend_dir")")"

            echo "::group::Building frontend for $app_name"
            pushd "$frontend_dir" > /dev/null
            npm ci
            npm run build
            popd > /dev/null
            echo "::endgroup::"
          done

      - name: Assemble deployment artifacts
        run: |
          # Define common exclusion rules in a temporary filter list
          cat << 'EOF' > /tmp/deploy_excludes
          node_modules/
          __pycache__/
          *.pyc
          *.pyo
          .pytest_cache/
          .venv/
          venv/
          .env
          .DS_Store
          Thumbs.db
          EOF

          # 1. Sync root-level files and shared repos (excluding git metadata and apps)
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='apps/' \
            --exclude-from=/tmp/deploy_excludes \
            source/ deploy_repo/

          # 2. Sync root files inside source/apps (homelab-env.yaml, scripts, etc.) without recursing subdirectories
          rsync -av \
            --exclude='*/' \
            --exclude-from=/tmp/deploy_excludes \
            source/apps/ deploy_repo/apps/

          # 3. Dynamically assemble each app under source/apps/
          for app_path in source/apps/*/; do
            [ -d "$app_path" ] || continue
            app="$(basename "$app_path")"
            target_app_dir="deploy_repo/apps/$app"

            echo "Assembling $app in deploy repo..."
            rm -rf "$target_app_dir"
            mkdir -p "$target_app_dir"

            # Copy backend, configs, assets, excluding the raw frontend folder
            rsync -av \
              --exclude='frontend/' \
              --exclude-from=/tmp/deploy_excludes \
              "$app_path" "$target_app_dir/"

            # If a built dist exists, copy it over
            if [ -d "${app_path}frontend/dist" ]; then
              mkdir -p "$target_app_dir/frontend/dist"
              rsync -a "${app_path}frontend/dist/" "$target_app_dir/frontend/dist/"
            fi
          done

      - name: Commit and push single deployment
        working-directory: deploy_repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Force add dist folders in case top-level .gitignore ignores 'dist/'
          find apps -type d -name "dist" -exec git add -f {} + 2>/dev/null || true

          git add .
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Deploy ${GITHUB_SHA}"
            git push origin deploy
          fi